<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d4d37"/>
      <stop offset="100%" stop-color="#1b3022"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2a03f"/>
      <stop offset="100%" stop-color="#c26d3e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Inner subtle border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#4a7c59" stroke-width="4" stroke-opacity="0.5"/>

  <!-- White medical calendar sheet with drop shadow -->
  <g filter="url(#shadow)">
    <!-- Calendar Card Base -->
    <rect x="96" y="110" width="320" height="300" rx="36" fill="#fbf9f5"/>
    <!-- Calendar Top Header Strip -->
    <path d="M 96 146 Q 96 110 132 110 L 380 110 Q 416 110 416 146 L 416 186 L 96 186 Z" fill="#2d4d37"/>
    
    <!-- Calendar Ring Clips -->
    <rect x="156" y="86" width="24" height="46" rx="12" fill="#e2a03f"/>
    <rect x="332" y="86" width="24" height="46" rx="12" fill="#e2a03f"/>

    <!-- Medical Cross Emblem centered on calendar -->
    <g transform="translate(256, 296)">
      <!-- Gold circle background -->
      <circle cx="0" cy="0" r="76" fill="#eef4f0" stroke="#cde0d3" stroke-width="4"/>
      <!-- Green Medical Cross -->
      <rect x="-16" y="-52" width="32" height="104" rx="12" fill="#2d4d37"/>
      <rect x="-52" y="-16" width="104" height="32" rx="12" fill="#2d4d37"/>
      <!-- Caduceus / Star Sparkle at center -->
      <circle cx="0" cy="0" r="12" fill="#e2a03f"/>
    </g>
  </g>

  <!-- Text "PW MedEd" at bottom of icon -->
  <text x="256" y="468" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="900" font-size="34" fill="#fbf9f5" letter-spacing="2">PW MedEd</text>
</svg>